# Requires mlky >= v4.1.0
# Must only define the system and the version, plus any additional utilities
# Examples:
# -p "local<-v2"
# -p "cluster<-v3<-quiet"
# -p "cluster<-v3<-loc1"

# Systems

local: # Populated with test data as an example, change as needed
  input:
    granules:
      dir: .local/data/granules/
      subdir: True
      products: '*'
        # - 001_20230203T184949_2303413_009
        # - 001_20220903T163129_2224611_012
        # - 001_20231015T215344_2328814_020
    rasters:
      dir: .local/data/mosaics/l2b/
      products:
        - min_-90_-85_30_35
        - min_-90_-85_35_40
        - min_-90_-85_40_45
  output:
    dir: ./output

flat: # If your granules are in a single directory flat structure
  mlky.patch: local
  input:
    granules:
      dir: .local/data/flat
      subdir: False

file: # Granules source from a text file, likely generated by the query module
  mlky.patch: local
  input:
    granules:
      products: test.txt
    rasters: \

cluster:
  version: no-version
  input:
    rasters:
      dir: /store/jamesmo/amd/runs/mosaics/data/l2b/
      products: 'min_*.hdr'
  output:
    dir: /store/jamesmo/amd/runs/mosaics/${version}
    merge: false
    netcdf: false
    geotiff: true
  ray:
    num_cpus: 20

mosaic:
  mlky.patch: cluster
  input:
    rasters:
      dir: /store/jamesmo/amd/runs/${run}/applied/
      products: 'min_*'
  output:
    dir: /store/jamesmo/amd/runs/${run}/${version}

iron-mountain:
  mlky.patch: mosaic
  run: iron-mountain

leadville:
  mlky.patch: mosaic
  run: leadville

bingham-canyon:
  mlky.patch: mosaic
  run: bingham-canyon

nw-us:
  mlky.patch: mosaic
  run: nw-us

sw-us:
  mlky.patch: mosaic
  run: sw-us

# Downloads

dl-example-urls:
  download:
    output: ./downloads
    urls:
      - https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/EMITL2ARFL.001/EMIT_L2A_RFL_001_20220903T163129_2224611_012/EMIT_L2A_RFL_001_20220903T163129_2224611_012.nc

dl-example-batch:
  download:
    output: ./downloads
    batch:
      base:
        L2A: https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/EMITL2ARFL.001/EMIT_L2A_RFL_{granule}/EMIT_L2A_{product}_{granule}.nc
        L2B: https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/EMITL2BMIN.001/EMIT_L2B_MIN_{granule}/EMIT_L2B_{product}_{granule}.nc
      granules:
        - 001_20230203T184949_2303413_009
        - 001_20220903T163129_2224611_012
        - 001_20231015T215344_2328814_020
      products:
        L2A:
          - MASK
          - RFL
        L2B:
          - MIN
          - MINUNCERT


# Locations

loc1: # ALUM GULCH, LEAD QUEEN
  subselect:
    latitude: [31.45, 31.55]
    longitude: [-110.8, -110.7]

# Utilities

quiet:
  log:
    terminal: INFO

# Filters

filter-depth:
  classify:
    group_1_mineral_id:
      filter:
        group_1_band_depth: "> .05"
    group_2_mineral_id:
      filter:
        group_2_band_depth: "> .05"

filter-fit:
  classify:
    group_1_mineral_id:
      filter:
        group_1_fit: "> .4"
    group_2_mineral_id:
      filter:
        group_2_fit: "> .4"

filter-clouds-granules:
  classify:
    group_1_mineral_id:
      filter:
        clouds: [0, 1, 3]
    group_2_mineral_id:
      filter:
        clouds: [0, 1, 3]

filter-clouds-agg:
  classify:
    group_1_mineral_id:
      filter:
        Aggregate Flag: "== 1"
    group_2_mineral_id:
      filter:
        Aggregate Flag: "== 1"

filter-clouds-1-4:
  classify:
    group_1_mineral_id:
      filter:
        Cloud flag: "== 1"
        Cirrus flag: "== 1"
        Water flag: "== 1"
        Spacecraft Flag: "== 1"
    group_2_mineral_id:
      filter:
        Cloud flag: "== 1"
        Cirrus flag: "== 1"
        Water flag: "== 1"
        Spacecraft Flag: "== 1"

filter-clouds-1-5:
  mlky.patch: filter-clouds-1-4
  classify:
    group_1_mineral_id:
      filter:
        Dilated Cloud Flag: "== 1"
    group_2_mineral_id:
      filter:
        Dilated Cloud Flag: "== 1"

# Versions

v1:
  version: v1
  hashmap: # Minerals mapping
    # pyrite
    1: [10]
    # goethite
    2: [3, 5, 6, 7, 8, 9, 18]
    # hematite
    3: [30, 31, 32, 33, 45, 47]
    # jarosite
    4: [9, 15, 49, 204, 205, 206]
    # schwertmannite
    5: [11]
    # copiapite
    6: [67]
    # Ca,Mg-carbonates
    7: [126, 184, 211, 212, 213, 214, 215, 216, 217, 218, 219, 225, 226, 227, 229, 230, 231, 232]
    # other carboantes
    8: [58, 63, 64, 220, 240, 241, 267, 270, 271]
    # Ca,Mg,Al (hydr)oxides
    9: [93, 153, 154, 155, 156, 237, 287]
    # soluble silicates (+ phosphates)
    10: [17, 27, 38, 125, 127, 128, 129, 130, 131, 132, 177, 178, 189, 190, 202]
  colors:
    #      R,   G,   B,   A
    1:  [220,   5,  12, 255]
    2:  [174, 118, 163, 255]
    3:  [209, 187, 215, 255]
    4:  [241, 147,  45, 255]
    5:  [246, 193,  65, 255]
    6:  [247, 240,  87, 255]
    7:  [123, 175, 222, 255]
    8:  [ 82, 137, 199, 255]
    9:  [ 25, 101, 176, 255]
    10: [136,  46, 114, 255]
  classify:
    group_1_mineral_id:
      filter:
        group_1_band_depth: "> .001"
    group_2_mineral_id:
      filter:
        group_2_band_depth: "> .001"

v2:
  mlky.patch: v1
  version: v2
  classify:
    group_1_mineral_id:
      filter:
        group_1_band_depth: "> .01"
    group_2_mineral_id:
      filter:
        group_2_band_depth: "> .01"

v3:
  mlky.patch: v1
  version: v3
  classify:
    group_1_mineral_id:
      filter:
        group_1_band_depth: "> .05"
    group_2_mineral_id:
      filter:
        group_2_band_depth: "> .05"

v4:
  version: v4
  hashmap: # Minerals mapping
    # pyrite
    1: [10]
    # jarosite, schwertmannite, copiapite
    2: [9, 15, 49, 204, 205, 206, 11, 67]
    # Ca,Mg-carbonates
    3: [126, 184, 211, 212, 213, 214, 215, 216, 217, 218, 219, 225, 226, 227, 229, 230, 231, 232]
  colors:
    #     R,   G,   B,   A
    1: [220,   5,  12, 255]
    2: [247, 240,  87, 255]
    3: [ 25, 101, 176, 255]

v5:
  mlky.patch: v3
  version: v5
  hashmap: # Minerals mapping
    # Fake NaNs
    -3: [-9999]
    # Tetracorder NaNs
    -2: [0]
    # Vegetation
    -1: [96, 97, 98]
    # pyrite
    1: [10, 78, 80]
    # goethite
    2: [3, 5, 6, 7, 8]
    # hematite
    3: [30, 31, 32, 33]
  colors:
    #      R,   G,   B,   A
    -3: [128, 128, 128,   0]
    -2: [128, 128, 128, 255]
    -1: [ 34, 136,  51, 255]
    0:  [  0,   0,   0, 255]
  classify:
    group_1_mineral_id:
      mask_class: -2 # Values filtered by the complete mask classify to this
    group_2_mineral_id:
      mask_class: -2
  stack:
    mincount: 3

v6:
